[workspace]
resolver = "2"
members = [
  "crates/ahrs",
  "crates/airframe",
  "crates/control",
  "crates/elrs",
  "crates/eskf",
  "crates/imu",
  "crates/indi",
  "crates/kinematics",
  "crates/lis3mdl",
  "crates/lps25hb",
  "crates/madgwick",
  "crates/mcp3208",
  "crates/mis2500",
  "crates/navigation",
  "crates/pwm",
  "crates/stabilization",
  "crates/tecs",
  "crates/tsd10",
  "crates/imu-viz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
defmt = "1"
defmt-rtt = "1"
embedded-hal = "1.0"
embedded-io = "0.7"
fugit = "0.4"
heapless = "0.9"
libm = "0.2"
nalgebra = { version = "0.35.0", default-features = false, features = ["libm"] }
panic-probe = { version = "1", features = ["print-defmt"] }

[workspace.dependencies.glam]
version = "0.33"
default-features = false
features = ["libm", "scalar-math"]

[profile.dev]
opt-level = 2
codegen-units = 1
